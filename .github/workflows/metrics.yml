name: Metrics
on:
  schedule: [{cron: "0 0 * * *"}]
  workflow_dispatch:
  push: {branches: ["root"]}
jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@v3.34
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: ChongxiSama
          template: classic
          base: header, repositories, metadata
          config_timezone: Asia/Shanghai
          filename: github-metrics.svg
          config_order: base.header, languages, habits, activity, lines, achievements, pagespeed

          # 语言统计
          plugin_languages: yes
          plugin_languages_ignored: html, css, scss
          plugin_languages_details: percentage
          plugin_languages_sections: most-used
          plugin_languages_limit: 8
          plugin_languages_recent_load: 350

          # 成就
          plugin_achievements: yes
          plugin_achievements_threshold: C
          plugin_achievements_display: compact

          # 贡献时间习惯
          plugin_habits: yes
          plugin_habits_from: 200
          plugin_habits_days: 14
          plugin_habits_facts: yes
          plugin_habits_charts: yes
          plugin_habits_trim: yes

          # 最近活动
          plugin_activity: yes
          plugin_activity_limit: 5
          plugin_activity_days: 14
          plugin_activity_filter: all

          # 代码行数增删
          plugin_lines: yes
          plugin_lines_history_limit: 1

          # 博客 SEO (Pagespeed)
          plugin_pagespeed: yes
          plugin_pagespeed_url: https://xice.cx
          plugin_pagespeed_detailed: yes
          plugin_pagespeed_screenshot: no
          plugin_pagespeed_token: ${{ secrets.PAGESPEED_TOKEN }}

          committer_token: ${{ secrets.GITHUB_TOKEN }}
