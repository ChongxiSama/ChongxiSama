name: Metrics
on:
  schedule: [{cron: "0 0 * * *"}]
  workflow_dispatch:
  push: {branches: ["root"]}
jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@v3.34
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: ChongxiSama
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: Asia/Shanghai
          plugin_languages: yes
          plugin_languages_ignored: html, css, scss
          plugin_languages_details: percentage, lines
          plugin_languages_sections: most-used, top-languages
          plugin_languages_limit: 8
          plugin_languages_recent_load: 300
          plugin_lines: yes
          plugin_lines_sections: repositories
          plugin_achievements: yes
          plugin_achievements_threshold: C
          plugin_achievements_display: compact
          filename: github-metrics.svg
          config_order: base.header, languages, lines, achievements
          committer_token: ${{ secrets.GITHUB_TOKEN }}
