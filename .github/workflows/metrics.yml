name: Metrics
on:
  schedule: [{cron: "0 0 * * *"}]
  workflow_dispatch:
jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: ChongxiSama
          template: classic
          
          base: header, activity, community, repositories, metadata
          config_timezone: America/Anchorage
          
          plugin_languages: yes
          plugin_languages_ignored: html, css, scss, tex
          plugin_languages_details: percentage
          plugin_languages_limit: 8
          plugin_languages_aliases: "Render:HTML" 
          force_account_repositories: yes 

          plugin_lines: yes

          plugin_habits: yes
          plugin_habits_from: 200
          plugin_habits_charts: yes
          plugin_habits_trim: yes

          plugin_followup: yes
          plugin_followup_sections: user
        
          plugin_stars: yes
          plugin_stars_limit: 4

          theme: tokyonight
          filename: github-metrics.svg
        
          config_order: base.header, languages, habits, lines, followup, stars
